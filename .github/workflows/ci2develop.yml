name: Change detection and Image tagging with github sha (DEV)

on:
  push:
    paths-ignore:
      - "deployment/**"
      - "scripts/**"
      - ".github/**"
      - "kubernetes/**"
    branches: [develop]
  workflow_dispatch:

jobs:
  detect-changes-by-component:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hub-auth: ${{ steps.filter.outputs.hub-auth }}
    steps:
      - uses: actions/checkout@v2
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            hub-auth:
              - 'hub/auth_server/**'

  ci-backend-dev:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-dev/backend:${{ github.sha }}-dev
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}-dev

  ci-frontend-dev:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-dev/frontend:${{ github.sha }}-dev
          provenance: false
          build-args: |
            SERVER_NAME=${{ secrets.DEV_SERVER_NAME }}
            APP_VERSION=${{ github.sha }}-dev
            SENTRY_ENVIRONMENT=development
            SENTRY_DSN_FRONTEND=${{ secrets.SENTRY_DSN_FRONTEND }}
            USE_SENTRY=1
          secrets: |
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"

  ci-hub-auth-dev:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.hub-auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./hub/auth_server
          file: ./hub/auth_server/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-dev/hub-auth:${{ github.sha }}-dev
          provenance: false

  update-dev-manifest:
    needs: [ci-backend-dev, ci-frontend-dev, ci-hub-auth-dev]
    # 컴포넌트가 하나라도 빌드 실패/취소되면 manifest 갱신을 하지 않는다.
    # skipped 된 컴포넌트는 허용함.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.ci-backend-dev.result == 'success' || needs.ci-frontend-dev.result == 'success' || needs.ci-hub-auth-dev.result == 'success')
    runs-on: ubuntu-latest
    # manifest는 한 번에 하나씩만 실행.
    concurrency:
      group: update-dev-manifest
      cancel-in-progress: false
    steps:
      # CI가 돌아갈 때 기준으로, develop 브랜치의 최신 커밋을 checkout함.
      # 그 후, 현재가 가장 최신의 커밋인지 확인 후, 최신이면 manifest갱신 아니면 skip
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide which image tags to update
        id: check
        run: |
          FILE=kubernetes/overlays/dev/kustomization.yaml
          # 이 CI를 실행시킨 커밋의 sha값 확인
          MY_SHA=${{ github.sha }}
          for name in backend frontend hub-auth; do

            # 현재 kustomization.yaml에 적힌 이미지 태그 확인
            current_tag=$(yq ".images[] | select(.name == \"$name\").newTag" "$FILE")
            current_sha=${current_tag%-dev}

            # 현재의 커밋이 과거의 커밋보다 최신인지 확인
            # 맞으면 -> 갱신 / 틀리면 -> skip
            if git merge-base --is-ancestor "$current_sha" "$MY_SHA"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name: $current_sha is newer than $MY_SHA, skip"
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # NOTE: 기존에 kustomize를 사용하였지만 포멧 문제로 yq로 변경 (junwoo)
      # images.[] .name 에 맞는 항목의 newTag 값을 github.sha-dev로 변경
      - name: Update Backend Image Tag
        if: needs.ci-backend-dev.result == 'success' && steps.check.outputs.backend == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "backend").newTag) = "${{ github.sha }}-dev"' kubernetes/overlays/dev/kustomization.yaml

      - name: Update Frontend Image Tag
        if: needs.ci-frontend-dev.result == 'success' && steps.check.outputs.frontend == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "frontend").newTag) = "${{ github.sha }}-dev"' kubernetes/overlays/dev/kustomization.yaml

      - name: Update Hub Auth Image Tag
        if: needs.ci-hub-auth-dev.result == 'success' && steps.check.outputs.hub-auth == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "hub-auth").newTag) = "${{ github.sha }}-dev"' kubernetes/overlays/dev/kustomization.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add kubernetes/overlays/dev/kustomization.yaml

          # 변경사항이 없으면 종료
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi

          # 충돌 방지를 위해 최신 develop 브랜치로 rebase 후 push
          # [skip ci] 태그를 커밋 메시지에 추가하여 추가 CI 실행을 방지
          git commit -m "ci: Update dev image tags to ${{ github.sha }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
