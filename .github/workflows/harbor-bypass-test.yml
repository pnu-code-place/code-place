name: harbor-bypass-test

# 정보화본부 보안장비 바이패스 전후 비교용 임시 워크플로 (2026-11-10).
# ci2develop.yml의 백엔드, 프론트 빌드와 Harbor push를 그대로 따라 하되,
# 이미지는 테스트 저장소(code-place-dev/bypass-test-*)에 올리고 끝나면 지운다.
# 배포 매니페스트는 건드리지 않는다. 다시 돌릴 때는 Actions 화면에서 "Re-run all jobs".
# 한 번 돌리면 백엔드, 프론트를 3라운드 연달아 push한다 (라운드마다 실제 CI처럼 둘이 동시에).
on:
  push:
    branches: [harbor-bypass-test]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: [1, 2, 3]
    steps:
      # 학교 쪽에서 출발지 IP로 로그를 찾으므로 로그인 전에 남긴다
      - name: Runner IP and time (KST)
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "start (KST): $(TZ=Asia/Seoul date '+%F %T')"

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-dev/bypass-test-backend:${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.round }}
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}-dev

      - name: End time (KST)
        if: always()
        run: |
          echo "end (KST): $(TZ=Asia/Seoul date '+%F %T')"

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: [1, 2, 3]
    steps:
      - name: Runner IP and time (KST)
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "start (KST): $(TZ=Asia/Seoul date '+%F %T')"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 실제 CI와 같고, 테스트 빌드가 Sentry에 릴리스를 만들지 않도록 Sentry만 끈다
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-dev/bypass-test-frontend:${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.round }}
          provenance: false
          build-args: |
            SERVER_NAME=${{ secrets.DEV_SERVER_NAME }}
            APP_VERSION=${{ github.sha }}-dev
            USE_SENTRY=0

      - name: End time (KST)
        if: always()
        run: |
          echo "end (KST): $(TZ=Asia/Seoul date '+%F %T')"

  cleanup:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete test repos from Harbor
        run: |
          for r in bypass-test-backend bypass-test-frontend bypass-test; do
            curl -s -o /dev/null -w "delete code-place-dev/$r: %{http_code}\n" --max-time 30 \
              -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" -X DELETE \
              "https://${{ secrets.HARBOR_REGISTRY }}/api/v2.0/projects/code-place-dev/repositories/$r" || true
          done
