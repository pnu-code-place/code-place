name: Continuous Integration to production registry and release (PROD)

on:
  push:
    paths-ignore:
      - "deployment/**"
      - "scripts/**"
      - "kubernetes/**"
    branches: [main]
  workflow_dispatch:

jobs:
  check-release-branch:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check_branch.outputs.is_release }}
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Check if merged from release branch
        id: check_branch
        run: |
          commit_message="${{ github.event.head_commit.message }}"
          if [[ "$commit_message" =~ ^Merge\ pull\ request.*from.*release- ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Extract version from merge commit message
        if: steps.check_branch.outputs.is_release == 'true'
        id: extract_version
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'release-\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  detect-changes-by-component:
    needs: [check-release-branch]
    if: ${{ needs.check-release-branch.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hub-auth: ${{ steps.filter.outputs.hub-auth }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: "main"
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            hub-auth:
              - 'hub/auth_server/**'

  ci-backend:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-prod/backend:${{ github.sha }}-prod
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}-prod

  ci-frontend:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-prod/frontend:${{ github.sha }}-prod
          provenance: false
          build-args: |
            SERVER_NAME=${{ secrets.PROD_SERVER_NAME }}
            APP_VERSION=${{ github.sha }}-prod
            SENTRY_ENVIRONMENT=production
            SENTRY_DSN_FRONTEND=${{ secrets.SENTRY_DSN_FRONTEND }}
            USE_SENTRY=1
          secrets: |
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"

  ci-hub-auth:
    needs: [detect-changes-by-component]
    if: ${{ needs.detect-changes-by-component.outputs.hub-auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./hub/auth_server
          file: ./hub/auth_server/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/code-place-prod/hub-auth:${{ github.sha }}-prod
          provenance: false

  update-prod-manifest:
    needs: [check-release-branch, ci-backend, ci-frontend, ci-hub-auth]
    # 컴포넌트가 하나라도 빌드 실패/취소되면 manifest 갱신을 하지 않는다.
    # skipped 된 컴포넌트는 허용함.
    if: |
      always() &&
      needs.check-release-branch.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.ci-frontend.result == 'success' || needs.ci-backend.result == 'success' || needs.ci-hub-auth.result == 'success')
    runs-on: ubuntu-latest
    # manifest는 한 번에 하나씩만 실행.
    concurrency:
      group: update-prod-manifest
      cancel-in-progress: false
    steps:
      # CI가 돌아갈 때 기준으로, main 브랜치의 최신 커밋을 checkout함.
      # 그 후, 현재가 가장 최신의 커밋인지 확인 후, 최신이면 manifest갱신 아니면 skip
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide which image tags to update
        id: check
        run: |
          FILE=kubernetes/overlays/prod/kustomization.yaml
          # 이 CI를 실행시킨 커밋의 sha값 확인
          MY_SHA=${{ github.sha }}
          for name in backend frontend hub-auth; do

            # 현재 kustomization.yaml에 적힌 이미지 태그 확인
            current_tag=$(yq ".images[] | select(.name == \"$name\").newTag" "$FILE")
            current_sha=${current_tag%-prod}

            # 현재의 커밋이 과거의 커밋보다 최신인지 확인
            # 맞으면 -> 갱신 / 틀리면 -> skip
            if git merge-base --is-ancestor "$current_sha" "$MY_SHA"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name: $current_sha is newer than $MY_SHA, skip"
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # NOTE: 기존에 kustomize를 사용하였지만 포멧 문제로 yq로 변경 (junwoo)
      # images.[] .name 에 맞는 항목의 newTag 값을 github.sha 로 변경
      - name: Update Backend Image Tag
        if: needs.ci-backend.result == 'success' && steps.check.outputs.backend == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "backend").newTag) = "${{ github.sha }}-prod"' kubernetes/overlays/prod/kustomization.yaml

      - name: Update Frontend Image Tag
        if: needs.ci-frontend.result == 'success' && steps.check.outputs.frontend == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "frontend").newTag) = "${{ github.sha }}-prod"' kubernetes/overlays/prod/kustomization.yaml

      - name: Update Hub Auth Image Tag
        if: needs.ci-hub-auth.result == 'success' && steps.check.outputs.hub-auth == 'true'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '(.images[] | select(.name == "hub-auth").newTag) = "${{ github.sha }}-prod"' kubernetes/overlays/prod/kustomization.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add kubernetes/overlays/prod/kustomization.yaml

          # 변경사항이 없으면 종료
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi

          # [skip ci] 태그를 커밋 메시지에 추가하여 추가 CI 실행을 방지
          git commit -m "ci: Update prod image tags to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin main

  create-release:
    needs: [check-release-branch, detect-changes-by-component, ci-backend, ci-frontend, ci-hub-auth, update-prod-manifest]
    # 변경 감지, 컴포넌트 빌드, manifest 갱신 중 하나라도 실패/취소되면 Release를 만들지 않는다.
    if: |
      always() &&
      needs.check-release-branch.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.update-prod-manifest.result == 'success' || needs.update-prod-manifest.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Debug Info
        run: |
          echo "Is Release: ${{ needs.check-release-branch.outputs.is_release }}"
          echo "Version: ${{ needs.check-release-branch.outputs.version }}"
          echo "CI Backend: ${{ needs.ci-backend.result }}"
          echo "CI Frontend: ${{ needs.ci-frontend.result }}"

      - name: Create Release
        if: needs.check-release-branch.outputs.version != ''
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
        with:
          tag_name: ${{ needs.check-release-branch.outputs.version }}
          release_name: Release ${{ needs.check-release-branch.outputs.version }}
          draft: false
          prerelease: false
