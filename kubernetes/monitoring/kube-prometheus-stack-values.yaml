crds:
  enabled: true
  # Helm does not upgrade CRDs from the chart's crds/ directory. Run the
  # chart-owned pre-upgrade hook so CRDs and the pinned operator stay aligned.
  upgradeJob:
    enabled: true
    forceConflicts: false

defaultRules:
  rules:
    # K3s embeds these control-plane components in k3s-server and does not
    # expose the standalone endpoints expected by kube-prometheus-stack.
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

prometheus:
  prometheusSpec:
    # A second Prometheus replica stores an independent full TSDB copy. This
    # cluster uses one durable Longhorn-backed instance to keep metric storage bounded.
    replicas: 1
    evaluationInterval: 15s
    scrapeInterval: 15s
    retention: 15d
    retentionSize: 45GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    probeSelector:
      matchLabels:
        release: kube-prometheus-stack
    probeNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    replicas: 2
    podAntiAffinity: soft
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    alertmanagerConfigMatcherStrategy:
      type: None
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: codeplace
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  # One replica owns a Longhorn ReadWriteOnce PVC. Recreate avoids a rolling
  # replacement waiting forever for the old pod to release that volume.
  deploymentStrategy:
    type: Recreate
  grafana.ini:
    metrics:
      enabled: true
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  additionalDataSources:
    - name: Loki
      uid: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        timeout: 60
    - name: Tempo
      uid: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: Loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: false
          filterBySpanID: false
          customQuery: true
          query: "{namespace=~\"code-place-dev|code-place-prod\"} |= \"${__span.traceId}\""
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.tls.certresolver: default
    hosts:
      - monitoring.code-place-dev.site
    tls:
      - hosts:
          - monitoring.code-place-dev.site
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
