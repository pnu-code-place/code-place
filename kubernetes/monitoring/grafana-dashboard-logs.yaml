apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace-logs
  labels:
    grafana_dashboard: "1"
data:
  codeplace-logs.json: |
    {
      "uid": "codeplace-logs",
      "title": "CodePlace Logs",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace", "logs"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,dev",
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          },
          {
            "name": "request_id",
            "label": "Request ID (exact; replace __unset__)",
            "type": "textbox",
            "query": "__unset__",
            "current": {
              "text": "__unset__",
              "value": "__unset__"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Log Lines",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 4},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "sum(count_over_time({namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "lines"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Backend Errors in Previous 5m",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 4},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "targets": [
            {"expr": "sum(count_over_time({namespace=\"code-place-$environment\", app=\"backend\"} | json | level=~\"ERROR|CRITICAL\" [5m]))", "legendFormat": "errors"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Frontend 5xx in Previous 5m",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 4},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "targets": [
            {"expr": "sum(count_over_time({namespace=\"code-place-$environment\", app=\"frontend\"} | json | status_code >= 500 [5m]))", "legendFormat": "5xx"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Selected Environment Log Rate",
          "gridPos": {"x": 0, "y": 4, "w": 8, "h": 7},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {"defaults": {"unit": "logs/sec", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (namespace) (rate({namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "{{namespace}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Application Log Lines by App",
          "gridPos": {"x": 8, "y": 4, "w": 8, "h": 7},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {"defaults": {"unit": "logs/sec", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (namespace, app) (rate({namespace=\"code-place-$environment\", app=~\"backend|frontend\"}[5m]))", "legendFormat": "{{namespace}} {{app}}"},
            {"expr": "sum by (namespace, container) (rate({namespace=\"code-place-$environment\", container=~\"celery-worker|celery-beat|judge-server|hub-auth|vllm\"}[5m]))", "legendFormat": "{{namespace}} {{container}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Structured Backend / Celery Error Logs",
          "gridPos": {"x": 16, "y": 4, "w": 8, "h": 7},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {"defaults": {"unit": "logs/sec", "custom": {"drawStyle": "bars", "lineInterpolation": "linear", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "barAlignment": 0, "stacking": {"mode": "normal", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (namespace, app) (rate({namespace=\"code-place-$environment\", app=\"backend\"} | json | level=~\"ERROR|CRITICAL\" [5m]))", "legendFormat": "{{namespace}} {{app}}"},
            {"expr": "sum by (namespace, container) (rate({namespace=\"code-place-$environment\", container=~\"celery-worker|celery-beat\"} | json | level=~\"ERROR|CRITICAL\" [5m]))", "legendFormat": "{{namespace}} {{container}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Ingress 5xx in Previous 5m",
          "gridPos": {"x": 0, "y": 11, "w": 4, "h": 4},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "targets": [
            {"expr": "sum(count_over_time({namespace=\"kube-system\", app_kubernetes_io_name=\"traefik\"} | json | RouterName=~\"code-place-$environment-.*\" | DownstreamStatus >= 500 [5m]))", "legendFormat": "5xx"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Selected Environment Log Rate by Node",
          "gridPos": {"x": 0, "y": 15, "w": 4, "h": 6},
          "datasource": {"type": "loki", "uid": "Loki"},
          "fieldConfig": {"defaults": {"unit": "logs/sec", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (node) (rate({namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "{{node}}"}
          ]
        },
        {
          "type": "logs",
          "title": "Recent Backend Errors",
          "gridPos": {"x": 4, "y": 11, "w": 10, "h": 10},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"code-place-$environment\", app=\"backend\"} | json | level=~\"ERROR|CRITICAL\""}
          ]
        },
        {
          "type": "logs",
          "title": "Auth, Judge, Celery, and vLLM Logs",
          "gridPos": {"x": 14, "y": 11, "w": 10, "h": 10},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"code-place-$environment\", container=~\"hub-auth|celery-worker|celery-beat|judge-server|vllm\"}"}
          ]
        },
        {
          "type": "logs",
          "title": "Ingress and Frontend 4xx/5xx Logs",
          "gridPos": {"x": 0, "y": 21, "w": 24, "h": 8},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"kube-system\", app_kubernetes_io_name=\"traefik\"} | json | RouterName=~\"code-place-$environment-.*\" | DownstreamStatus >= 400", "legendFormat": "traefik"},
            {"expr": "{namespace=\"code-place-$environment\", app=\"frontend\"} | json | status_code >= 400", "legendFormat": "frontend"}
          ]
        },
        {
          "type": "logs",
          "title": "Request ID Lookup",
          "gridPos": {"x": 0, "y": 29, "w": 24, "h": 9},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"code-place-$environment\"} | json | request_id=\"$request_id\""}
          ]
        },
        {
          "type": "text",
          "title": "Frontend Runtime Error Tracking",
          "gridPos": {"x": 0, "y": 38, "w": 24, "h": 8},
          "options": {
            "mode": "markdown",
            "content": "Frontend runtime exceptions are captured by Sentry with the deployment release, environment, and per-error request ID. They are intentionally not queried from Loki because the browser is not a Kubernetes log producer."
          }
        }
      ]
    }
