apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace-ai-inference
  labels:
    grafana_dashboard: "1"
data:
  codeplace-ai-inference.json: |
    {
      "uid": "codeplace-ai-inference",
      "title": "CodePlace AI Runtime (Prod)",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace", "ai", "runtime", "vllm", "prod"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Prod vLLM Scrape Up",
          "description": "Production-only vLLM runtime scrape health.",
          "gridPos": {"x": 0, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "up{job=\"vllm\", namespace=\"code-place-prod\"}", "legendFormat": "vllm", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Prod DCGM Scrape Up",
          "description": "GPU telemetry scrape health for the production vLLM node.",
          "gridPos": {"x": 5, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "min(up{job=\"dcgm-exporter\", namespace=\"monitoring\"})", "legendFormat": "dcgm-exporter", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Prod vLLM Running Requests",
          "gridPos": {"x": 10, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}},
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max({__name__=\"vllm:num_requests_running\", namespace=\"code-place-prod\"})", "legendFormat": "running", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Prod vLLM Waiting Requests",
          "gridPos": {"x": 15, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max({__name__=\"vllm:num_requests_waiting\", namespace=\"code-place-prod\"})", "legendFormat": "waiting", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Prod vLLM KV Cache Usage",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.9}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max({__name__=\"vllm:kv_cache_usage_perc\", namespace=\"code-place-prod\"})", "legendFormat": "kv-cache", "instant": true}          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM Requests",
          "gridPos": {"x": 0, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "{__name__=\"vllm:num_requests_running\", namespace=\"code-place-prod\"}", "legendFormat": "running"},
            {"expr": "{__name__=\"vllm:num_requests_waiting\", namespace=\"code-place-prod\"}", "legendFormat": "waiting"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM Request Success Rate",
          "gridPos": {"x": 8, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "stepAfter",
                "lineWidth": 1,
                "fillOpacity": 70,
                "showPoints": "never",
                "barAlignment": 0,
                "stacking": {"mode": "normal", "group": "A"}
              }
            }
          },
          "targets": [
            {"expr": "sum by (finished_reason) (rate({__name__=\"vllm:request_success_total\", namespace=\"code-place-prod\"}[5m]))", "legendFormat": "{{finished_reason}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM p95 Latency",
          "gridPos": {"x": 16, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=\"vllm:e2e_request_latency_seconds_bucket\", namespace=\"code-place-prod\"}[10m])))", "legendFormat": "e2e p95"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=\"vllm:request_queue_time_seconds_bucket\", namespace=\"code-place-prod\"}[10m])))", "legendFormat": "queue p95"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=\"vllm:time_to_first_token_seconds_bucket\", namespace=\"code-place-prod\"}[10m])))", "legendFormat": "ttft p95"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM Token Throughput",
          "gridPos": {"x": 0, "y": 12, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "sum(rate({__name__=\"vllm:prompt_tokens_total\", namespace=\"code-place-prod\"}[5m]))", "legendFormat": "prompt tokens/s"},
            {"expr": "sum(rate({__name__=\"vllm:generation_tokens_total\", namespace=\"code-place-prod\"}[5m]))", "legendFormat": "generation tokens/s"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM CPU Usage",
          "gridPos": {"x": 6, "y": 12, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"code-place-prod\", pod=~\"vllm-.*\", container=\"vllm\"}[5m]))", "legendFormat": "{{pod}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM Memory Usage",
          "gridPos": {"x": 12, "y": 12, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"code-place-prod\", pod=~\"vllm-.*\", container=\"vllm\"})", "legendFormat": "{{pod}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod vLLM HF Cache PVC",
          "gridPos": {"x": 18, "y": 12, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "max(kubelet_volume_stats_used_bytes{namespace=\"code-place-prod\", persistentvolumeclaim=\"vllm-hf-cache\"}) / clamp_min(max(kubelet_volume_stats_capacity_bytes{namespace=\"code-place-prod\", persistentvolumeclaim=\"vllm-hf-cache\"}), 1)", "legendFormat": "usage"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod GPU Utilization",
          "description": "GPU telemetry is for the production-only vLLM node.",
          "gridPos": {"x": 0, "y": 20, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 80},
                  {"color": "red", "value": 95}
                ]
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_DEV_GPU_UTIL{namespace=\"monitoring\"}", "legendFormat": "{{Hostname}} gpu{{gpu}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod GPU FB Memory Usage",
          "gridPos": {"x": 6, "y": 20, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.8},
                  {"color": "red", "value": 0.9}
                ]
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_DEV_FB_USED{namespace=\"monitoring\"} / clamp_min(DCGM_FI_DEV_FB_USED{namespace=\"monitoring\"} + DCGM_FI_DEV_FB_FREE{namespace=\"monitoring\"}, 1)", "legendFormat": "{{Hostname}} gpu{{gpu}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod GPU Temperature",
          "gridPos": {"x": 12, "y": 20, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 75},
                  {"color": "red", "value": 85}
                ]
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_DEV_GPU_TEMP{namespace=\"monitoring\"}", "legendFormat": "{{Hostname}} gpu{{gpu}}"}
          ]
        },
        {
          "type": "state-timeline",
          "title": "Prod GPU Last XID Error Code",
          "description": "DCGM의 GPU별 마지막 XID code입니다. 0은 오류 없음이며, 0이 아닌 숫자는 심각도나 발생 횟수가 아닌 오류 종류입니다.",
          "gridPos": {"x": 18, "y": 20, "w": 6, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "No XID error", "color": "green", "index": 0}
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_DEV_XID_ERRORS{namespace=\"monitoring\"}", "legendFormat": "{{Hostname}} gpu{{gpu}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod GPU Tensor / DRAM Activity",
          "gridPos": {"x": 0, "y": 28, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{namespace=\"monitoring\"}", "legendFormat": "{{Hostname}} gpu{{gpu}} tensor"},
            {"expr": "DCGM_FI_PROF_DRAM_ACTIVE{namespace=\"monitoring\"}", "legendFormat": "{{Hostname}} gpu{{gpu}} dram"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Prod GPU FB Memory Bytes",
          "gridPos": {"x": 12, "y": 28, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "DCGM_FI_DEV_FB_USED{namespace=\"monitoring\"} * 1024 * 1024", "legendFormat": "{{Hostname}} gpu{{gpu}} used"},
            {"expr": "DCGM_FI_DEV_FB_FREE{namespace=\"monitoring\"} * 1024 * 1024", "legendFormat": "{{Hostname}} gpu{{gpu}} free"}
          ]
        }
      ]
    }
