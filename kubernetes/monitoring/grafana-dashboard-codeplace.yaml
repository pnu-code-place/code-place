apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace
  labels:
    grafana_dashboard: "1"
data:
  codeplace-overview.json: |
    {
      "uid": "codeplace-overview",
      "title": "CodePlace Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,dev",
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Backend Up",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "min by (namespace) (up{job=\"backend\", namespace=\"code-place-$environment\"})", "legendFormat": "{{namespace}}", "instant": true}
          ]
        },
        {
          "type": "timeseries",
          "title": "API / Ingress Request Rate",
          "gridPos": {"x": 4, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "codeplace:api_request_rate5m{namespace=\"code-place-$environment\"}", "legendFormat": "{{namespace}} api"},
            {"expr": "codeplace:ingress_request_rate2m{namespace=\"code-place-$environment\"}", "legendFormat": "{{namespace}} ingress"}
          ]
        },
        {
          "type": "timeseries",
          "title": "API / Ingress 5xx Ratio",
          "gridPos": {"x": 9, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              }
            }
          },
          "targets": [
            {"expr": "codeplace:api_5xx_ratio5m{namespace=\"code-place-$environment\"}", "legendFormat": "{{namespace}} api"},
            {"expr": "codeplace:ingress_5xx_rate2m{namespace=\"code-place-$environment\"} / clamp_min(codeplace:ingress_request_rate2m{namespace=\"code-place-$environment\"}, 0.001)", "legendFormat": "{{namespace}} ingress"}
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 Latency",
          "gridPos": {"x": 14, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 2}
                ]
              }
            }
          },
          "targets": [
            {"expr": "codeplace:api_p95_latency_seconds5m{namespace=\"code-place-$environment\"}", "legendFormat": "{{namespace}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Judge Waiting Queue",
          "gridPos": {"x": 19, "y": 0, "w": 5, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "stacking": {"mode": "none", "group": "A"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 3},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "targets": [
            {"expr": "codeplace:judge_waiting_queue_length{namespace=\"code-place-$environment\"}", "legendFormat": "{{namespace}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Backend Requests by Status",
          "gridPos": {"x": 0, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "bars", "lineInterpolation": "linear", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "barAlignment": 0, "stacking": {"mode": "normal", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (namespace, status_code) (rate(codeplace_http_requests_total{namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "{{namespace}} {{status_code}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Backend Latency",
          "gridPos": {"x": 8, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "lineInterpolation": "linear", "lineWidth": 2, "fillOpacity": 10, "showPoints": "auto", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (namespace, le) (rate(codeplace_http_request_duration_seconds_bucket{namespace=\"code-place-$environment\"}[5m])))", "legendFormat": "{{namespace}} p95"},
            {"expr": "histogram_quantile(0.99, sum by (namespace, le) (rate(codeplace_http_request_duration_seconds_bucket{namespace=\"code-place-$environment\"}[5m])))", "legendFormat": "{{namespace}} p99"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Judge Queue Length",
          "gridPos": {"x": 16, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "stacking": {"mode": "none", "group": "A"}}}},
          "targets": [
            {"expr": "max by (namespace) (codeplace_waiting_queue_length{namespace=\"code-place-$environment\"})", "legendFormat": "{{namespace}} waiting_queue"},
            {"expr": "max by (namespace) (codeplace_celery_broker_queue_length{namespace=\"code-place-$environment\"})", "legendFormat": "{{namespace}} celery"}
          ]
        },
        {
          "type": "row",
          "title": "Judge / Async Outcomes",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 1},
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Submission / Judge Outcomes",
          "gridPos": {"x": 0, "y": 13, "w": 24, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "bars", "lineInterpolation": "linear", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "barAlignment": 0, "stacking": {"mode": "normal", "group": "A"}}}},
          "targets": [
            {"expr": "sum by (namespace, scope, status) (rate(codeplace_submission_create_outcome_total{namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "{{namespace}} create {{scope}} {{status}}/s"},
            {"expr": "avg by (namespace, scope, status) (rate(codeplace_judge_task_outcome_total{namespace=\"code-place-$environment\"}[5m]))", "legendFormat": "{{namespace}} judge {{scope}} {{status}}/s"}
          ]
        },
        {
          "type": "row",
          "title": "Current Health",
          "gridPos": {"x": 0, "y": 21, "w": 24, "h": 1},
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "Pod Ready",
          "description": "선택한 환경의 애플리케이션 Pod별 현재 readiness입니다. 1은 Ready, 0은 Not Ready입니다.",
          "gridPos": {"x": 0, "y": 22, "w": 12, "h": 7},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"showHeader": true, "cellHeight": "sm"},
          "targets": [
            {"expr": "min by (namespace, pod) (kube_pod_status_ready{namespace=\"code-place-$environment\", condition=\"true\", pod=~\"backend-.*|frontend-.*|hub-auth-.*|celery-.*|judge-server-.*|postgres-.*|redis-.*|vllm-.*\"})", "legendFormat": "{{namespace}} {{pod}}", "format": "table", "instant": true}
          ]
        },
        {
          "type": "table",
          "title": "Deployment Unavailable Replicas",
          "description": "Deployment별 unavailable replica 수와 generation 반영 여부를 현재값 표로 표시합니다.",
          "gridPos": {"x": 12, "y": 22, "w": 12, "h": 7},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"showHeader": true, "cellHeight": "sm"},
          "targets": [
            {"expr": "label_replace(max by (namespace, deployment) (kube_deployment_status_replicas_unavailable{namespace=\"code-place-$environment\", deployment=~\"backend|frontend|hub-auth|celery-worker|celery-beat|judge-server|vllm\"}), \"condition\", \"unavailable replicas\", \"deployment\", \".*\") or label_replace(max by (namespace, deployment) (kube_deployment_status_observed_generation{namespace=\"code-place-$environment\", deployment=~\"backend|frontend|hub-auth|celery-worker|celery-beat|judge-server|vllm\"} != bool on (namespace, deployment) kube_deployment_metadata_generation{namespace=\"code-place-$environment\", deployment=~\"backend|frontend|hub-auth|celery-worker|celery-beat|judge-server|vllm\"}), \"condition\", \"generation mismatch\", \"deployment\", \".*\")", "legendFormat": "{{namespace}} {{deployment}} {{condition}}", "format": "table", "instant": true}
          ]
        },
        {
          "type": "stat",
          "title": "Service Ready Endpoints",
          "gridPos": {"x": 0, "y": 29, "w": 8, "h": 5},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum by (namespace, service) (label_replace(kube_endpointslice_endpoints{namespace=\"code-place-$environment\", endpointslice=~\"(backend|frontend|hub-auth|judge-server|vllm)-.*\", ready=\"true\"}, \"service\", \"$1\", \"endpointslice\", \"(backend|frontend|hub-auth|judge-server|vllm)-.*\"))", "legendFormat": "{{namespace}} {{service}} ready endpoints", "instant": true}
          ]
        },
        {
          "type": "stat",
          "title": "PostgreSQL Ready Replicas",
          "gridPos": {"x": 8, "y": 29, "w": 8, "h": 5},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "green", "value": 3}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum by (namespace) (kube_pod_status_ready{namespace=\"code-place-$environment\", condition=\"true\", pod=~\"postgres-[0-9]+\"}) or vector(0)", "legendFormat": "{{namespace}} ready", "instant": true}
          ]
        },
        {
          "type": "stat",
          "title": "Redis/Sentinel Ready Replicas",
          "gridPos": {"x": 16, "y": 29, "w": 8, "h": 5},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 3},
                  {"color": "green", "value": 6}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum by (namespace) (kube_pod_status_ready{namespace=\"code-place-$environment\", condition=\"true\", pod=~\"redis-.*|redis-replication-.*\"}) or vector(0)", "legendFormat": "{{namespace}} ready", "instant": true}
          ]
        }
      ]
    }
