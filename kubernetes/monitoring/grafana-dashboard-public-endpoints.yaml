apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace-public-endpoints
  labels:
    grafana_dashboard: "1"
data:
  codeplace-public-endpoints.json: |
    {
      "uid": "codeplace-public-endpoints",
      "title": "CodePlace Public Endpoints",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace", "synthetic", "blackbox"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,dev",
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "$environment Endpoint Health",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "probe_success{environment=\"$environment\", probe_type=\"public-http\"}", "legendFormat": "{{service}} {{instance}}", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "$environment Probe Target Coverage",
          "description": "Healthy Prometheus scrape targets divided by the two expected workload probes (frontend and hub-auth).",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 0.5},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(up{job=~\"codeplace-(public|hub-auth)-http-$environment\"}) / 2", "legendFormat": "healthy / expected", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "$environment HTTP Status",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 200},
                  {"color": "red", "value": 400}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "probe_http_status_code{environment=\"$environment\", probe_type=\"public-http\"}", "legendFormat": "{{service}} {{instance}}", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "$environment TLS Days Left",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 14},
                  {"color": "green", "value": 30}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "(probe_ssl_earliest_cert_expiry{environment=\"$environment\", probe_type=\"public-http\"} - time()) / 86400", "legendFormat": "{{service}} {{instance}}", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "$environment Probe Duration",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 2}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "probe_duration_seconds{environment=\"$environment\", probe_type=\"public-http\"}", "legendFormat": "{{service}} {{instance}}", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Grafana Self Probe",
          "description": "Monitoring-plane probe kept separate from the selected application environment.",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "probe_success{environment=\"monitoring\", service=\"grafana\", probe_type=\"public-http\"}", "legendFormat": "grafana", "instant": true}          ]
        },
        {
          "type": "timeseries",
          "title": "$environment Endpoint Availability",
          "gridPos": {"x": 0, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "codeplace:public_endpoint_availability5m{environment=\"$environment\"}", "legendFormat": "{{service}} {{instance}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "$environment Endpoint Duration",
          "gridPos": {"x": 8, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "probe_duration_seconds{environment=\"$environment\", probe_type=\"public-http\"}", "legendFormat": "{{service}} {{instance}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "$environment TLS Days Left",
          "gridPos": {"x": 16, "y": 4, "w": 8, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 14},
                  {"color": "green", "value": 30}
                ]
              }
            }
          },
          "targets": [
            {"expr": "(probe_ssl_earliest_cert_expiry{environment=\"$environment\", probe_type=\"public-http\"} - time()) / 86400", "legendFormat": "{{service}} {{instance}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "$environment HTTP Phase Duration",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "probe_http_duration_seconds{environment=\"$environment\", probe_type=\"public-http\"}", "legendFormat": "{{service}} {{phase}}"}
          ]
        }
      ]
    }
