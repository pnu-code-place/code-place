apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace-kubernetes-events
  labels:
    grafana_dashboard: "1"
data:
  codeplace-kubernetes-events.json: |
    {
      "uid": "codeplace-kubernetes-events",
      "title": "CodePlace Kubernetes Events",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace", "kubernetes", "events"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,dev",
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Event Telemetry Health (Global)",
          "description": "Cluster-wide collector health. Missing exporter or kube-state-metrics scrapes are treated as unhealthy, so expected-zero event states do not hide telemetry loss.",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max(kube_deployment_status_replicas_available{namespace=\"monitoring\", deployment=\"kubernetes-event-exporter\"}) or vector(0)", "legendFormat": "exporter ready", "instant": true},            {"expr": "max(up{namespace=\"monitoring\", job=\"kubernetes-event-exporter\"}) or vector(0)", "legendFormat": "exporter scrape", "instant": true},            {"expr": "max(up{namespace=\"monitoring\", service=~\".*kube-state-metrics.*\"}) or vector(0)", "legendFormat": "kube-state-metrics scrape", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Image Pull BackOff",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"code-place-$environment\", reason=~\"ImagePullBackOff|ErrImagePull\"}) or vector(0)", "legendFormat": "pods", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "CrashLoop BackOff",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"code-place-$environment\", reason=\"CrashLoopBackOff\"}) or vector(0)", "legendFormat": "pods", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "OOMKilled",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum((kube_pod_container_status_last_terminated_reason{namespace=\"code-place-$environment\", reason=\"OOMKilled\"} == 1) and on (namespace, pod, container) (kube_pod_container_status_last_terminated_timestamp{namespace=\"code-place-$environment\"} > time() - 600)) or vector(0)", "legendFormat": "containers", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Pending Pods",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(kube_pod_status_phase{namespace=\"code-place-$environment\", phase=\"Pending\"}) or vector(0)", "legendFormat": "pods", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Unschedulable Pods",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(kube_pod_status_unschedulable{namespace=\"code-place-$environment\"}) or vector(0)", "legendFormat": "pods", "instant": true}          ]
        },
        {
          "type": "state-timeline",
          "title": "Container Waiting Reasons",
          "description": "컨테이너별 waiting 상태의 시작과 종료를 표시합니다. 막대 높이는 사건 횟수가 아닙니다.",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "Normal", "color": "green", "index": 0},
                    "1": {"text": "Waiting", "color": "red", "index": 1}
                  }
                }
              ]
            }
          },
          "targets": [
            {"expr": "sum by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{namespace=\"code-place-$environment\", reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"})", "legendFormat": "{{namespace}} {{pod}} {{container}} {{reason}}"}
          ]
        },
        {
          "type": "state-timeline",
          "title": "Recent OOMKilled Containers",
          "description": "최근 10분 내 OOMKilled 여부를 컨테이너별 상태로 표시합니다.",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "Clear", "color": "green", "index": 0},
                    "1": {"text": "OOMKilled", "color": "red", "index": 1}
                  }
                }
              ]
            }
          },
          "targets": [
            {"expr": "max by (namespace, pod, container) ((kube_pod_container_status_last_terminated_reason{namespace=\"code-place-$environment\", reason=\"OOMKilled\"} == bool 1) * on (namespace, pod, container) (kube_pod_container_status_last_terminated_timestamp{namespace=\"code-place-$environment\"} > bool time() - 600))", "legendFormat": "{{namespace}} {{pod}} {{container}}"}
          ]
        },
        {
          "type": "logs",
          "title": "Kubernetes Warning Events",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 9},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"monitoring\", app_kubernetes_io_name=\"kubernetes-event-exporter\"} | json | metadata_namespace=\"code-place-$environment\" | line_format \"[{{.reason}}] {{.involvedObject_kind}}/{{.involvedObject_name}}: {{.message}}\""}
          ]
        },
        {
          "type": "logs",
          "title": "Scheduling, Pull, Restart, and Probe Events",
          "gridPos": {"x": 0, "y": 21, "w": 24, "h": 9},
          "datasource": {"type": "loki", "uid": "Loki"},
          "options": {
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {"expr": "{namespace=\"monitoring\", app_kubernetes_io_name=\"kubernetes-event-exporter\"} | json | metadata_namespace=\"code-place-$environment\" |~ \"FailedScheduling|ImagePullBackOff|ErrImagePull|BackOff|OOMKilling|Unhealthy|FailedMount|FailedAttachVolume\" | line_format \"[{{.reason}}] {{.involvedObject_kind}}/{{.involvedObject_name}}: {{.message}}\""}
          ]
        }
      ]
    }
