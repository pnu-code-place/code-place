apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeplace-storage
  labels:
    grafana_dashboard: "1"
data:
  codeplace-storage.json: |
    {
      "uid": "codeplace-storage",
      "title": "CodePlace Storage",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["codeplace", "storage", "longhorn"],
      "links": [
        {
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "tags": ["codeplace"],
          "targetBlank": false,
          "title": "CodePlace Dashboards",
          "type": "dashboards"
        }
      ],
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,dev",
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Cluster Longhorn Scrape Up",
          "description": "Cluster-global Longhorn telemetry health. Environment selection only scopes PVC panels below.",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "min(up{namespace=\"longhorn-system\", endpoint=\"manager\"})", "legendFormat": "longhorn-manager", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Manager Availability",
          "description": "Available Longhorn managers divided by the DaemonSet desired count.",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 0.5},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "kube_daemonset_status_number_available{namespace=\"longhorn-system\", daemonset=\"longhorn-manager\"} / clamp_min(kube_daemonset_status_desired_number_scheduled{namespace=\"longhorn-system\", daemonset=\"longhorn-manager\"}, 1)", "legendFormat": "available / desired", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Faulted Volumes",
          "gridPos": {"x": 0, "y": 4, "w": 8, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(max by (volume, pvc_namespace, pvc) (longhorn_volume_robustness) == bool 3) or vector(0)", "legendFormat": "faulted", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Degraded Volumes",
          "gridPos": {"x": 8, "y": 4, "w": 8, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(max by (volume, pvc_namespace, pvc) (longhorn_volume_robustness) == bool 2) or vector(0)", "legendFormat": "degraded", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Read-only Volumes",
          "gridPos": {"x": 16, "y": 4, "w": 8, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "sum(max by (volume, pvc_namespace, pvc) (longhorn_volume_file_system_read_only)) or vector(0)", "legendFormat": "read-only", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Max Node Storage",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max((longhorn_node_storage_usage_bytes + longhorn_node_storage_reservation_bytes) / clamp_min(longhorn_node_storage_capacity_bytes, 1))", "legendFormat": "usage", "instant": true}          ]
        },
        {
          "type": "stat",
          "title": "Cluster Max Disk Usage",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          },
          "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {"expr": "max((longhorn_disk_usage_bytes + longhorn_disk_reservation_bytes) / clamp_min(longhorn_disk_capacity_bytes, 1))", "legendFormat": "usage", "instant": true}          ]
        },
        {
          "type": "state-timeline",
          "title": "$environment PVC Robustness",
          "description": "Longhorn robustness for PVCs in code-place-$environment.",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "Unknown", "color": "gray", "index": 0},
                    "1": {"text": "Healthy", "color": "green", "index": 1},
                    "2": {"text": "Degraded", "color": "orange", "index": 2},
                    "3": {"text": "Faulted", "color": "red", "index": 3}
                  }
                }
              ]
            }
          },
          "targets": [
            {"expr": "max by (pvc_namespace, pvc) (longhorn_volume_robustness{pvc_namespace=\"code-place-$environment\"})", "legendFormat": "{{pvc}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "$environment PVC Actual / Capacity",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "max by (pvc_namespace, pvc) (longhorn_volume_actual_size_bytes{pvc_namespace=\"code-place-$environment\"})", "legendFormat": "{{pvc}} actual"},
            {"expr": "max by (pvc_namespace, pvc) (longhorn_volume_capacity_bytes{pvc_namespace=\"code-place-$environment\"})", "legendFormat": "{{pvc}} capacity"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster Node Storage Usage",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {"mode": "line"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          },
          "targets": [
            {"expr": "(longhorn_node_storage_usage_bytes + longhorn_node_storage_reservation_bytes) / clamp_min(longhorn_node_storage_capacity_bytes, 1)", "legendFormat": "{{node}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster Disk Usage",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {"mode": "line"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.75},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          },
          "targets": [
            {"expr": "(longhorn_disk_usage_bytes + longhorn_disk_reservation_bytes) / clamp_min(longhorn_disk_capacity_bytes, 1)", "legendFormat": "{{node}} {{disk}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster Longhorn Manager CPU",
          "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "longhorn_manager_cpu_usage_millicpu / 1000", "legendFormat": "{{node}}"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Cluster Longhorn Manager Memory",
          "gridPos": {"x": 12, "y": 24, "w": 12, "h": 8},
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            }
          },
          "targets": [
            {"expr": "longhorn_manager_memory_usage_bytes", "legendFormat": "{{node}}"}
          ]
        }
      ]
    }
