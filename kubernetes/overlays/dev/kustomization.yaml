apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ./secrets/pg-credentials.yaml
  - ./secrets/regcred.yaml
  - ./secrets/common-credentials.yaml
  - ./secrets/sentry-secret.yaml
namespace: code-place-dev
patches:
  - path: backend-deployment-patch.yaml
  - path: frontend-deployment-patch.yaml
  - path: frontend-ingress-patch.yaml
  - path: celery-worker-deployment-patch.yaml
  - path: celery-beat-deployment-patch.yaml
  - path: judge-server-deployment-patch.yaml
  - path: hub-auth-ingress-patch.yaml
  - path: postgres-cluster-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: postgres
# NOTE: base 디렉토리의 이미지 이름과 태그를 오버라이드합니다.
# `backend`, `frontend`, `hub-auth` 이미지 태그는 CI 파이프라인에서 자동으로 변경됩니다.
# `judge-server` 이미지는 자주 변경되지 않으므로 수동으로 설정합니다.
images:
  - name: backend
    newName: harbor.code-place-dev.kr/code-place-dev/backend
    newTag: 07eb5d9cdef17b200399711341d57a285616901e-dev
  - name: frontend
    newName: harbor.code-place-dev.kr/code-place-dev/frontend
    newTag: b60d9dca4dfc325b9c14f8cc89ded68516a4bafb-dev
  - name: judge-server
    newName: harbor.code-place-dev.kr/code-place-dev/judge-server
    newTag: 1.0.3
  - name: hub-auth
    newName: harbor.code-place-dev.kr/code-place-dev/hub-auth
    newTag: 644531052f1ef464fe902ce0522fcffeb2a76ee5-dev
